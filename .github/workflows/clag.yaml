name: Clag CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
        lang: [c, cpp]

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential clang

      - name: Build (Release)
        run: |
          if [ "${{ matrix.lang }}" = "c" ]; then
            ${{ matrix.cc }} test.c -O2 -o test
          else
            ${{ matrix.cc }} test.c -x c++ -std=c++17 -O2 -o test
          fi

      - name: Run (Release)
        run: ./test

      - name: Build (Debug + Sanitizers)
        run: |
          if [ "${{ matrix.lang }}" = "c" ]; then
            ${{ matrix.cc }} test.c -g -fsanitize=address,undefined -o test_dbg
          else
            ${{ matrix.cc }} -x c++ test.c -std=c++17 -g -fsanitize=address,undefined -o test_dbg
          fi

      - name: Run (Debug)
        run: ./test_dbg

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        lang: [c, cpp]

    steps:
      - uses: actions/checkout@v4

      - name: Build (Release)
        run: |
          if [ "${{ matrix.lang }}" = "c" ]; then
            clang test.c -O2 -o test
          else
            clang++ test.c -std=c++17 -O2 -o test
          fi

      - name: Run (Release)
        run: ./test

      - name: Build (Debug + Sanitizers)
        run: |
          if [ "${{ matrix.lang }}" = "c" ]; then
            clang test.c -g -fsanitize=address,undefined -o test_dbg
          else
            clang++ test.c -std=c++17 -g -fsanitize=address,undefined -o test_dbg
          fi

      - name: Run (Debug)
        run: ./test_dbg

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        lang: [c, cpp]
        mode: ["", "/Zi"]

    steps:
      - uses: actions/checkout@v4

      - name: Build & Run (MSVC)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          if "${{ matrix.lang }}"=="c" (
            cl.exe test.c /std:c11 /W4 /WX ${{ matrix.mode }} /Fe:test.exe
          ) else (
            cl.exe test.c /TP /std:c++17 /W4 /WX ${{ matrix.mode }} /Fe:test.exe
          )

          test.exe
